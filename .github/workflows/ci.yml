name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-validate:
    # ⏱ A HANG-CATCHER, NOT A PERFORMANCE GATE. GitHub's default is 6 hours, and this repo has
    # already burned nearly two of them on one step: `bench` ran 113 minutes on lavapipe (~2 GFLOP/s
    # against a hardcoded 30 iterations of a 137-GFLOP matmul) and looked identical to a hang, because
    # the job had died at compile since 2026-07-22 and no one had ever seen it finish. There was no
    # duration to bound it against; there is now. Measured on the first fully green run (33927133667):
    # software GPU 34.2 min, real Metal 15.2 min, proofs 7.1 min. These sit at ~2.5-3x that, so
    # ordinary variance never trips them while a hang costs minutes. Metal is 70
    # because the release det_tanh sweep was added on top of the 15 minute job.
    # ⚠ ONE green sample each for the whole-job numbers. `Test workspace` is stable across three runs
    # (566/579/575 s); the validation step has a single green observation (1218 s). Raise a bound if
    # a legitimate run approaches it — do not tighten one toward an observation.
    timeout-minutes: 90
    name: build + validate (software GPU)
    runs-on: ubuntu-latest
    env:
      # Mesa 26.0.8's lavapipe is built against LLVM 21.1.8. On the AVX-512 EPYC
      # hosts ubuntu-latest hands out, that JIT assigns the VEX-only AVX2_SETALLONES
      # pseudo to ymm16–31 and the shader faults (llvm/llvm-project#169009,
      # mesa#16702). `cargo test -p ferric-llama` died with signal 11. The same
      # suite passes on this Mesa when the host is Intel and on LLVM 20. AVX2
      # codegen is the target that does not hit it.
      #
      # The token is `avx`, not `avx2`. u_cpu_detect.c treats the value as a
      # ceiling: `avx` clears has_avx512f and leaves has_avx2 set. `avx2` matches
      # nothing, so it is a no-op and AVX-512 stays on. It does not skip a test
      # or change an assertion. Metal and Kani do not read it.
      GALLIUM_OVERRIDE_CPU_CAPS: avx
      LP_NATIVE_VECTOR_WIDTH: "256"
      FERRIC_REQUIRE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@v7

      # Pin matches rust-toolchain.toml. Action release: dtolnay/rust-toolchain v1
      # (tag moved 2026-10-16). checkout v7.0.1 is the current major (2026-07-20).
      # rust-cache v2.9.3 is still major v2 (2026-10-20); there is no v3.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Software Vulkan (lavapipe) so wgpu has a real compute adapter on a headless runner —
      # the validation examples run the actual GPU kernels, just on a CPU rasterizer.
      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          vulkaninfo --summary || true

      - name: Build workspace
        run: cargo --locked build --workspace --verbose

      # ⛔ RUN BEFORE THE SUITE, BECAUSE A GREEN SUITE IS NOT EVIDENCE IF A TEST CANNOT FAIL.
      # ferric-tokenizer shipped `marks_join_the_letter_run_under_qwen35_and_not_under_qwen2` with no
      # `#[test]` attribute — the single assertion proving the real \p{M} tables changed user-visible
      # tokenization, which was the entire point of the commit that landed them. The body had just
      # been rewritten from asserting the OLD behaviour, and the attribute went with the old body: the
      # tripwire was disarmed by the act of responding to it. `--list` showed two tests in a module
      # whose source reads like three, and `cargo test --workspace` was green throughout.
      # rustc reported it as `function ... is never used`; nothing grepped for that. This does.
      # Linux only — it is pure text analysis with no platform dependence, so a second run buys nothing.
      - name: Gate — no disarmed tests
        run: |
          ./scripts/disarmed_tests.sh --self-test   # prove the detector can fail, every run
          ./scripts/disarmed_tests.sh

      # The unit + integration suites. These were absent from CI entirely, which meant the
      # placement-invariance test, the prefix-hash guards, the interval-arithmetic soundness check and
      # every other assertion in the workspace ran only on a developer's machine.
      #
      # Lavapipe's LLVM JIT SIGSEGVs when several tests in one process compile
      # shaders at once. One test at a time, the same ferric-llama binary passes.
      # Every assertion still runs. Metal keeps the parallel suite.
      # ubuntu-latest is 26.04. actions/setup-python has no CPython 3.12.3 build for
      # that image (run 46012924240). This is the published 24.04 build of 3.12.3,
      # which links an older glibc and runs on 26.04. The sha256 is the pin.
      - name: Python 3.12.3
        run: |
          python3 - << 'PY'
          import hashlib, os, tarfile, urllib.request
          url = "https://github.com/actions/python-versions/releases/download/3.12.3-11057844995/python-3.12.3-linux-24.04-x64.tar.gz"
          expected = "07ef2452a390e76505b5a26b37bae7f88bc260926ca70ae88cb679003ab42279"
          path = "/tmp/python-3.12.3.tar.gz"
          urllib.request.urlretrieve(url, path)
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          if digest != expected:
              raise SystemExit(f"python tarball sha256 {digest}")
          dest = os.path.expanduser("~/python-3.12.3")
          os.makedirs(dest, exist_ok=True)
          with tarfile.open(path) as archive:
              archive.extractall(dest, filter="data")
          with open(os.environ["GITHUB_PATH"], "a") as pathfile:
              pathfile.write(dest + "/bin\n")
          print("extracted", dest)
          PY
          "$HOME/python-3.12.3/bin/python3" -c 'import sys; assert sys.version_info[:3] == (3, 12, 3), sys.version; print(sys.version)'

      - name: numpy for the det_tanh table generator
        run: |
          python3 -m pip install --disable-pip-version-check "numpy==1.26.4"
          python3 -c 'import sys, numpy; assert sys.version_info[:3] == (3, 12, 3), sys.version; assert numpy.__version__ == "1.26.4", numpy.__version__; print(sys.version); print("numpy", numpy.__version__)'

      - name: Test workspace
        run: cargo --locked test --workspace --verbose -- --test-threads=1

      # Every finite f32 against a correctly rounded tanh. Ignored in the suite
      # above because a debug build of a billion f64 tanh calls does not fit
      # the job. This is the lock on the 1 ulp bound.
      - name: Exhaustive det_tanh sweep
        run: cargo --locked test --release -p ferric-core --lib det_tanh_every_finite_f32 -- --ignored --test-threads=1 --nocapture

      - name: Build browser target (wasm32 + WebGPU)
        # Every crate that claims to be wasm-clean is built here, so the claim is CI-enforced rather
        # than asserted in a doc. ferric-kv in particular documents its scheduler tests as running
        # "on any target including wasm" — that only means something if wasm is actually compiled.
        #
        # ⚠ ferric-llama AND ferric-web ARE THE POINT, and they were the two missing from this list.
        # The leaf crates all compiled, so this step passed green while `wasm-pack build
        # crates/ferric-web` — the command that actually produces the browser bundle — had been
        # failing outright: qwen35.rs used `ferric_tier::FileBacking`, which ferric-tier gates out of
        # wasm, and a `static Mutex<Vec<Tensor>>` that cannot exist where wgpu's Buffer is Rc-based.
        # A wasm gate that omits the browser crate is not a wasm gate. Keep this list ending in the
        # two crates below, and prefer adding new crates ahead of them.
        run: |
          for c in ferric-core ferric-kv ferric-tier ferric-certify ferric-dist ferric-gguf ferric-tokenizer ferric-llama ferric-web; do
            echo "::group::$c"; cargo --locked build -p $c --target wasm32-unknown-unknown; echo "::endgroup::"
          done

      # Every example validates its GPU result against a reference (CPU / onnxruntime / numpy).
      # Skips run_projectors (needs the SmolVLA-derived fixtures that aren't committed).
      - name: Validate — core (transformer, LM, KV-cache generation)
        run: |
          for ex in transformer_block decoder_layer tiny_llm generate; do
            echo "::group::$ex"; cargo --locked run -p ferric-core --example $ex; echo "::endgroup::"
          done

      - name: Validate — ONNX importer vs onnxruntime references
        run: |
          for ex in run_mlp run_attn run_block run_struct run_swiglu; do
            echo "::group::$ex"; cargo --locked run -p ferric-onnx --example $ex; echo "::endgroup::"
          done

      - name: Validate — safetensors loader + Llama bridge
        run: |
          cargo --locked run -p ferric-load --example load_safetensors
          cargo --locked run -p ferric-llama --example run_llama
          cargo --locked run -p ferric-llama --example run_llama_unified
          cargo --locked run -p ferric-llama --example run_llama_quant
          # hyv4's whole graph on a synthetic checkpoint: hyper-connections, the DSA indexer and its
          # sharing schedule, clamped-SwiGLU MoE, and CACHED DECODE against a full re-run. Run on
          # BOTH fabrics for the reason the Metal job already states about chunked_attn — a
          # mask-offset bug that appears on one backend and not the other is exactly what a
          # single-backend CI cannot see, and decode is a mask-offset feature.
          cargo --locked run -p ferric-llama --example hyv4_synthetic

      - name: Validate — general tensor runtime + autograd training
        run: |
          cargo --locked run -p ferric-tensor --example general
          cargo --locked run -p ferric-tensor --example train
          cargo --locked run -p ferric-tensor --example dtypes
          cargo --locked run -p ferric-tensor --example transformer
          cargo --locked run -p ferric-tensor --example classify
          cargo --locked run -p ferric-tensor --example train_transformer
          cargo --locked run -p ferric-tensor --example bench
          cargo --locked run -p ferric-tensor --example autotune
          cargo --locked run -p ferric-tensor --example coverage
          cargo --locked run -p ferric-tensor --example ebm
          cargo --locked run -p ferric-tensor --example jepa
          cargo --locked run -p ferric-tensor --example slice
          cargo --locked run -p ferric-tensor --example cat
          cargo --locked run -p ferric-tensor --example flash
          cargo --locked run -p ferric-tensor --example chunked_attn
          cargo --locked run -p ferric-tensor --example gdn_state
          cargo --locked run -p ferric-tensor --example fattn
          cargo --locked run -p ferric-tensor --example overhead
          cargo --locked run -p ferric-tensor --example bandwidth
          cargo --locked run -p ferric-tensor --example subgroup_spike
          cargo --locked run -p ferric-tensor --example coop_spike
          cargo --locked run -p ferric-tensor --example coop_gemm
          cargo --locked run -p ferric-tensor --example coop_matmul_route
          cargo --locked run -p ferric-tensor --example coop_q2_0
          cargo --locked run -p ferric-tensor --example coop_q4_k
          cargo --locked run -p ferric-tensor --example coop_q6_k
          cargo --locked run -p ferric-tensor --example coop_q5_k
          cargo --locked run -p ferric-tensor --example coop_q8_0
          cargo --locked run -p ferric-tensor --example bench_fuse_mm
          cargo --locked run -p ferric-tensor --example bench_gdn
          cargo --locked run -p ferric-tensor --example batch
          FERRIC_Q2_0_KERNEL=trans cargo --locked run -p ferric-tensor --example q2_0
          cargo --locked run -p ferric-tensor --example q2_0
          cargo --locked run -p ferric-tensor --example q4_0
          cargo --locked run -p ferric-tensor --example q4_k
          cargo --locked run -p ferric-tensor --example q5_k
          cargo --locked run -p ferric-tensor --example q6_k
          cargo --locked run -p ferric-tensor --example q8_0
          FERRIC_Q2_0_KERNEL=flat cargo --locked run -p ferric-tensor --example q2_0
          FERRIC_Q2_0_KERNEL=splitk cargo --locked run -p ferric-tensor --example q2_0
          cargo --locked run -p ferric-tensor --example fusion
          cargo --locked run -p ferric-gguf --example roundtrip
          cargo --locked run -p ferric-tokenizer --example roundtrip
          cargo --locked run -p ferric-tensor --example devices
          cargo --locked run -p ferric-tensor --example fabric

  macos-metal:
    timeout-minutes: 70
    name: build + validate (real Metal)
    runs-on: macos-latest
    env:
      FERRIC_REQUIRE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo --locked build --workspace --verbose

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: numpy for the det_tanh table generator
        run: |
          python3 -m pip install --disable-pip-version-check "numpy==1.26.4"
          python3 -c 'import sys, numpy; assert sys.version_info[:3] == (3, 12, 3), sys.version; assert numpy.__version__ == "1.26.4", numpy.__version__; print(sys.version); print("numpy", numpy.__version__)'

      - name: Test workspace
        run: cargo --locked test --workspace --verbose

      # Same sweep as the software-GPU job. The CPU code has no libm, so a
      # disagreement here is a contraction or a runtime difference, not a
      # second algorithm.
      - name: Exhaustive det_tanh sweep
        run: cargo --locked test --release -p ferric-core --lib det_tanh_every_finite_f32 -- --ignored --test-threads=1 --nocapture

      - name: Build browser target (wasm32 + WebGPU)
        # Every crate that claims to be wasm-clean is built here, so the claim is CI-enforced rather
        # than asserted in a doc. ferric-kv in particular documents its scheduler tests as running
        # "on any target including wasm" — that only means something if wasm is actually compiled.
        #
        # ⚠ ferric-llama AND ferric-web ARE THE POINT, and they were the two missing from this list.
        # The leaf crates all compiled, so this step passed green while `wasm-pack build
        # crates/ferric-web` — the command that actually produces the browser bundle — had been
        # failing outright: qwen35.rs used `ferric_tier::FileBacking`, which ferric-tier gates out of
        # wasm, and a `static Mutex<Vec<Tensor>>` that cannot exist where wgpu's Buffer is Rc-based.
        # A wasm gate that omits the browser crate is not a wasm gate. Keep this list ending in the
        # two crates below, and prefer adding new crates ahead of them.
        run: |
          for c in ferric-core ferric-kv ferric-tier ferric-certify ferric-dist ferric-gguf ferric-tokenizer ferric-llama ferric-web; do
            echo "::group::$c"; cargo --locked build -p $c --target wasm32-unknown-unknown; echo "::endgroup::"
          done

      # Ferric's differentiating claim is bit-reproducible output ACROSS FABRICS. The Linux job runs on
      # lavapipe — a software rasterizer — so until now no CI job had ever executed a Ferric kernel on a
      # hardware backend, and Metal is the one fabric a hosted runner can actually provide. A determinism
      # guarantee tested on exactly one software implementation is not tested.
      - name: Validate — kernels on real Metal
        run: |
          for ex in transformer_block decoder_layer tiny_llm generate; do
            echo "::group::$ex"; cargo --locked run -p ferric-core --example $ex; echo "::endgroup::"
          done
          cargo --locked run -p ferric-tensor --example devices
          cargo --locked run -p ferric-tensor --example fabric
          cargo --locked run -p ferric-tensor --example dtypes
          cargo --locked run -p ferric-tensor --example general
          # New kernel path (chunked prefill). Runs on BOTH jobs deliberately: lavapipe above and real
          # Metal here, because a mask-offset bug that only appears on one fabric is exactly the kind
          # of thing a single-backend CI cannot see.
          cargo --locked run -p ferric-tensor --example chunked_attn
          cargo --locked run -p ferric-llama --example hyv4_synthetic

      # Certificates and the tier policy are pure arithmetic and must agree everywhere. If a result here
      # differs from the Linux job, something is platform-dependent that must not be.
      - name: Validate — certificate re-verification (must match Linux exactly)
        run: cargo --locked run -p ferric-tensor --example ebm_cert_verify

  proofs:
    timeout-minutes: 30
    # Bounded model checks (Kani/CBMC). These hold for ALL inputs in range, not for chosen values.
    # Separate job so a slow solver never delays the build gate, and so a proof regression is
    # named as one rather than buried in a test log. What they do and do not cover is at the top of
    # scripts/proofs.sh; a green run here is exactly that much and no more.
    name: proofs (Kani bounded model checking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Kani 0.68.0 is the latest release (2026-09-16). It does not build with the
      # stable 1.100.0 pin: the bundle carries its own nightly-2026-08-21
      # (rustc 1.100.0-nightly, 8925ea358, 2026-08-20). The action installs that
      # toolchain and cargo-kani selects it, so this job does not use
      # dtolnay/rust-toolchain. Workspace rust-version stays 1.98: Cargo will not
      # treat 1.100.0-nightly as satisfying rust-version = "1.100".
      # kani-github-action v1.1 is still the latest action release (2024-01-10).
      - uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: '0.68.0'
          command: ./scripts/proofs.sh
