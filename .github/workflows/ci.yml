name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-validate:
    # ⏱ A HANG-CATCHER, NOT A PERFORMANCE GATE. GitHub's default is 6 hours, and this repo has
    # already burned nearly two of them on one step: `bench` ran 113 minutes on lavapipe (~2 GFLOP/s
    # against a hardcoded 30 iterations of a 137-GFLOP matmul) and looked identical to a hang, because
    # the job had died at compile since 2026-07-22 and no one had ever seen it finish. There was no
    # duration to bound it against; there is now. Measured on the first fully green run (33927133667):
    # software GPU 34.2 min, real Metal 15.2 min, proofs 7.1 min. These sit at ~2.5-3x that, so
    # ordinary variance never trips them while a hang costs minutes.
    # ⚠ ONE green sample each for the whole-job numbers. `Test workspace` is stable across three runs
    # (566/579/575 s); the validation step has a single green observation (1218 s). Raise a bound if
    # a legitimate run approaches it — do not tighten one toward an observation.
    timeout-minutes: 90
    name: build + validate (software GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Software Vulkan (lavapipe) so wgpu has a real compute adapter on a headless runner —
      # the validation examples run the actual GPU kernels, just on a CPU rasterizer.
      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          vulkaninfo --summary || true

      - name: Build workspace
        run: cargo build --workspace --verbose

      # The unit + integration suites. These were absent from CI entirely, which meant the
      # placement-invariance test, the prefix-hash guards, the interval-arithmetic soundness check and
      # every other assertion in the workspace ran only on a developer's machine. They take ~1.5s.
      - name: Test workspace
        run: cargo test --workspace --verbose

      - name: Build browser target (wasm32 + WebGPU)
        # Every crate that claims to be wasm-clean is built here, so the claim is CI-enforced rather
        # than asserted in a doc. ferric-kv in particular documents its scheduler tests as running
        # "on any target including wasm" — that only means something if wasm is actually compiled.
        #
        # ⚠ ferric-llama AND ferric-web ARE THE POINT, and they were the two missing from this list.
        # The leaf crates all compiled, so this step passed green while `wasm-pack build
        # crates/ferric-web` — the command that actually produces the browser bundle — had been
        # failing outright: qwen35.rs used `ferric_tier::FileBacking`, which ferric-tier gates out of
        # wasm, and a `static Mutex<Vec<Tensor>>` that cannot exist where wgpu's Buffer is Rc-based.
        # A wasm gate that omits the browser crate is not a wasm gate. Keep this list ending in the
        # two crates below, and prefer adding new crates ahead of them.
        run: |
          for c in ferric-core ferric-kv ferric-tier ferric-certify ferric-dist ferric-gguf ferric-tokenizer ferric-llama ferric-web; do
            echo "::group::$c"; cargo build -p $c --target wasm32-unknown-unknown; echo "::endgroup::"
          done

      # Every example validates its GPU result against a reference (CPU / onnxruntime / numpy).
      # Skips run_projectors (needs the SmolVLA-derived fixtures that aren't committed).
      - name: Validate — core (transformer, LM, KV-cache generation)
        run: |
          for ex in transformer_block decoder_layer tiny_llm generate; do
            echo "::group::$ex"; cargo run -p ferric-core --example $ex; echo "::endgroup::"
          done

      - name: Validate — ONNX importer vs onnxruntime references
        run: |
          for ex in run_mlp run_attn run_block run_struct run_swiglu; do
            echo "::group::$ex"; cargo run -p ferric-onnx --example $ex; echo "::endgroup::"
          done

      - name: Validate — safetensors loader + Llama bridge
        run: |
          cargo run -p ferric-load --example load_safetensors
          cargo run -p ferric-llama --example run_llama
          cargo run -p ferric-llama --example run_llama_unified
          cargo run -p ferric-llama --example run_llama_quant

      - name: Validate — general tensor runtime + autograd training
        run: |
          cargo run -p ferric-tensor --example general
          cargo run -p ferric-tensor --example train
          cargo run -p ferric-tensor --example dtypes
          cargo run -p ferric-tensor --example transformer
          cargo run -p ferric-tensor --example classify
          cargo run -p ferric-tensor --example train_transformer
          cargo run -p ferric-tensor --example bench
          cargo run -p ferric-tensor --example autotune
          cargo run -p ferric-tensor --example coverage
          cargo run -p ferric-tensor --example ebm
          cargo run -p ferric-tensor --example jepa
          cargo run -p ferric-tensor --example slice
          cargo run -p ferric-tensor --example cat
          cargo run -p ferric-tensor --example flash
          cargo run -p ferric-tensor --example chunked_attn
          cargo run -p ferric-tensor --example gdn_state
          cargo run -p ferric-tensor --example fattn
          cargo run -p ferric-tensor --example overhead
          cargo run -p ferric-tensor --example bandwidth
          cargo run -p ferric-tensor --example subgroup_spike
          cargo run -p ferric-tensor --example coop_spike
          cargo run -p ferric-tensor --example coop_gemm
          cargo run -p ferric-tensor --example coop_matmul_route
          cargo run -p ferric-tensor --example coop_q2_0
          cargo run -p ferric-tensor --example coop_q4_k
          cargo run -p ferric-tensor --example coop_q6_k
          cargo run -p ferric-tensor --example coop_q5_k
          cargo run -p ferric-tensor --example coop_q8_0
          cargo run -p ferric-tensor --example bench_fuse_mm
          cargo run -p ferric-tensor --example bench_gdn
          cargo run -p ferric-tensor --example batch
          FERRIC_Q2_0_KERNEL=trans cargo run -p ferric-tensor --example q2_0
          cargo run -p ferric-tensor --example q2_0
          cargo run -p ferric-tensor --example q4_0
          cargo run -p ferric-tensor --example q4_k
          cargo run -p ferric-tensor --example q5_k
          cargo run -p ferric-tensor --example q6_k
          cargo run -p ferric-tensor --example q8_0
          FERRIC_Q2_0_KERNEL=flat cargo run -p ferric-tensor --example q2_0
          FERRIC_Q2_0_KERNEL=splitk cargo run -p ferric-tensor --example q2_0
          cargo run -p ferric-tensor --example fusion
          cargo run -p ferric-gguf --example roundtrip
          cargo run -p ferric-tokenizer --example roundtrip
          cargo run -p ferric-tensor --example devices
          cargo run -p ferric-tensor --example fabric

  macos-metal:
    timeout-minutes: 45
    name: build + validate (real Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Test workspace
        run: cargo test --workspace --verbose

      - name: Build browser target (wasm32 + WebGPU)
        # Every crate that claims to be wasm-clean is built here, so the claim is CI-enforced rather
        # than asserted in a doc. ferric-kv in particular documents its scheduler tests as running
        # "on any target including wasm" — that only means something if wasm is actually compiled.
        #
        # ⚠ ferric-llama AND ferric-web ARE THE POINT, and they were the two missing from this list.
        # The leaf crates all compiled, so this step passed green while `wasm-pack build
        # crates/ferric-web` — the command that actually produces the browser bundle — had been
        # failing outright: qwen35.rs used `ferric_tier::FileBacking`, which ferric-tier gates out of
        # wasm, and a `static Mutex<Vec<Tensor>>` that cannot exist where wgpu's Buffer is Rc-based.
        # A wasm gate that omits the browser crate is not a wasm gate. Keep this list ending in the
        # two crates below, and prefer adding new crates ahead of them.
        run: |
          for c in ferric-core ferric-kv ferric-tier ferric-certify ferric-dist ferric-gguf ferric-tokenizer ferric-llama ferric-web; do
            echo "::group::$c"; cargo build -p $c --target wasm32-unknown-unknown; echo "::endgroup::"
          done

      # Ferric's differentiating claim is bit-reproducible output ACROSS FABRICS. The Linux job runs on
      # lavapipe — a software rasterizer — so until now no CI job had ever executed a Ferric kernel on a
      # hardware backend, and Metal is the one fabric a hosted runner can actually provide. A determinism
      # guarantee tested on exactly one software implementation is not tested.
      - name: Validate — kernels on real Metal
        run: |
          for ex in transformer_block decoder_layer tiny_llm generate; do
            echo "::group::$ex"; cargo run -p ferric-core --example $ex; echo "::endgroup::"
          done
          cargo run -p ferric-tensor --example devices
          cargo run -p ferric-tensor --example fabric
          cargo run -p ferric-tensor --example dtypes
          cargo run -p ferric-tensor --example general
          # New kernel path (chunked prefill). Runs on BOTH jobs deliberately: lavapipe above and real
          # Metal here, because a mask-offset bug that only appears on one fabric is exactly the kind
          # of thing a single-backend CI cannot see.
          cargo run -p ferric-tensor --example chunked_attn

      # Certificates and the tier policy are pure arithmetic and must agree everywhere. If a result here
      # differs from the Linux job, something is platform-dependent that must not be.
      - name: Validate — certificate re-verification (must match Linux exactly)
        run: cargo run -p ferric-tensor --example ebm_cert_verify

  proofs:
    timeout-minutes: 30
    # Bounded model checks (Kani/CBMC). These hold for ALL inputs in range, not for chosen values.
    # Separate job so a slow solver never delays the build gate, and so a proof regression is
    # named as one rather than buried in a test log. What they do and do not cover is at the top of
    # scripts/proofs.sh; a green run here is exactly that much and no more.
    name: proofs (Kani bounded model checking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: '0.67.0'   # matches the version the proofs were written and mutation-tested against
          command: ./scripts/proofs.sh
