<!doctype html><meta charset="utf-8"><title>text regression</title><pre id="log"></pre>
<script type="module">
window.runGen = async () => {
  const m = await import('/pkg/ferric_web.js'); await m.default();
  if (!navigator.gpu) return 'NO_WEBGPU';
  const model = await m.FerricModel.load(new Uint8Array(await (await fetch('/bonsai.gguf')).arrayBuffer()));
  const t = performance.now();
  const out = await model.generate('The capital of France is', 12);
  return `info=${model.info()} | ${((performance.now()-t)/1000).toFixed(1)}s | ${JSON.stringify(out)}`;
};
</script>
