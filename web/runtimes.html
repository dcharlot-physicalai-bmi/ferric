<!doctype html><meta charset="utf-8"><title>ferric runtimes</title>
<body style="font:14px monospace">
<div id="status">boot</div><div id="info"></div><pre id="gen"></pre><div id="stats"></div>
<script type="module">
import init, { FerricModel } from './pkg/ferric_web.js';
const q = new URLSearchParams(location.search);
const S = (m) => document.getElementById('status').textContent = m;
try {
  await init();
  S('fetching model');
  const r = await fetch(q.get('model'));
  if (!r.ok) throw new Error('fetch ' + r.status);
  const bytes = new Uint8Array(await r.arrayBuffer());
  S('loading ' + (bytes.length / 1048576 | 0) + ' MB');
  const m = await FerricModel.load(bytes);
  // KV config BEFORE the info render: the first version rendered first, so the page said "kv f32"
  // whatever the run actually used — an observable that could not distinguish the switch working
  // from the switch being ignored. The driver asserts on this line.
  const kv = q.get('kv');
  if (kv) m.setKvCache(kv, q.get('grouped') === '1');
  document.getElementById('info').textContent = m.info() + ' · kv ' + m.kvCache();
  // "The weights can be on the outside": knowledge is FETCHED at inference time rather than stored
  // in parameters. ?ctx=<url> pulls a document over the tab's native network access and grounds the
  // prompt in it — the in-tab model supplies language competence, the web supplies the facts. This is
  // the architectural reason a 450 MB ternary model in a browser is not a compromise.
  let prompt = q.get('prompt') || 'The capital of France is';
  // Corpus-scale "weights on the outside": ?corpus=<url> fetches a document set, EMBEDS every chunk
  // and the question IN-TAB, ranks by cosine, and grounds generation in the winners. Retrieval and
  // generation are both local; only the corpus is remote. The chosen chunk index is rendered as a
  // receipt so the driver can assert retrieval picked the RIGHT knowledge, not just any knowledge.
  const corpusUrl = q.get('corpus');
  if (corpusUrl) {
    S('embedding corpus');
    const chunks = (await (await fetch(corpusUrl)).text()).split(/\n\s*\n/).map(c => c.trim()).filter(c => c);
    const qv = await m.embed(prompt);
    const scored = [];
    for (let i = 0; i < chunks.length; i++) {
      const cv = await m.embed(chunks[i]);
      let dot = 0; for (let k = 0; k < qv.length; k++) dot += qv[k] * cv[k];
      scored.push([dot, i]);
    }
    scored.sort((x, y) => y[0] - x[0]);
    const top = scored.slice(0, 2);
    document.getElementById('info').textContent += ' · retrieved ' + top.map(([s,i]) => i + ':' + s.toFixed(3)).join(' ');
    prompt = 'Context:\n' + top.map(([_, i]) => chunks[i]).join('\n') + '\n\nQuestion: ' + prompt + '\nAnswer:';
  }
  const ctxUrl = q.get('ctx');
  if (ctxUrl) {
    S('fetching context');
    const doc = await (await fetch(ctxUrl)).text();
    prompt = 'Context:\n' + doc.trim() + '\n\nQuestion: ' + prompt + '\nAnswer:';
  }
  S('generating');
  const t0 = performance.now();
  let out = '';
  const text = await m.generate(prompt, parseInt(q.get('steps') || '12'),
    (tok) => { out += tok; document.getElementById('gen').textContent = out; });
  const dt = (performance.now() - t0) / 1000;
  document.getElementById('gen').textContent = text;
  document.getElementById('stats').textContent = (text.length ? (parseInt(q.get('steps') || '12') / dt).toFixed(1) : '0') + ' tok/s';
  S('done');
} catch (e) { S('ERROR: ' + e); }
</script>
