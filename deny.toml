# Supply-chain policy for the workspace. Path forks under forks/ are the wgpu 30.0.2
# tree with the Ferric patches; they are not a second registry.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]
all-features = false
features = []

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# paste has no fixed release. tokenizers 0.23.2, the latest stable, still
# depends on it. tokenizers 1.0.0-rc.4 is a pre-release and is not taken.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is unmaintained with no upgrade; required by tokenizers 0.23.2" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
