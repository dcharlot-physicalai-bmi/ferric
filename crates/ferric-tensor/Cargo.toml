[package]
name = "ferric-tensor"
description = "Ferric L2 — a general N-dimensional tensor runtime on the GPU fabric: arbitrary rank, strided views, broadcasting, general reductions, batched matmul (dtypes + autograd next)."
# ⚠ NOT `version.workspace = true`, and only until the next workspace bump.
#
# 0.3.0 as published could not compile on macOS — it reached for a `wgpu-hal` accessor that exists
# only in this repo's fork, applied through a `[patch.crates-io]` that IS NOT PUBLISHED. The fix
# shipped as a patch release of THIS CRATE ALONE, because bumping the shared workspace version would
# have republished all nineteen while two of them had uncommitted work in flight.
#
# Restore `version.workspace = true` at the next workspace bump, which must be to 0.3.2 or higher.
version = "0.3.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tensor", "gpu", "webgpu", "ndarray", "ai"]
categories = ["science", "mathematics"]

# ⛔ `metal4-interop` IS OFF BY DEFAULT AND MUST STAY OFF, and the reason is a publishing defect
# this crate shipped once already.
#
# The Metal-4 tensor-unit path needs the `MTLBuffer` behind a wgpu buffer. Stock `wgpu-hal` keeps
# that field private and exposes no accessor, so this repo carries a two-line fork in `forks/` that
# adds `Buffer::raw_handle`, applied through `[patch.crates-io]` in the workspace manifest.
#
# **`[patch]` SECTIONS ARE NOT PUBLISHED.** A crate uploaded to crates.io resolves STOCK `wgpu-hal`,
# where `raw_handle` does not exist — so `ferric-tensor` 0.3.0 as published cannot compile on macOS
# for anybody, while building perfectly in this repo. The fork that makes local development pleasant
# is exactly what hides the breakage from everyone who has it.
#
# So the default build uses only stock, current dependencies and the interop returns `None`, which
# every in-library caller already handles by falling back to WGSL. Turn the feature on when you have
# the patched hal (that is: in this repo), and the accelerated path returns.
#
# The real fix is upstream: `raw_handle` is a read-only accessor on an already-`unsafe` API surface,
# and wgpu should expose it. Until it does, this line is the honest position.
[features]
default = []
metal4-interop = []

[dependencies]
ferric-core = { path = "../ferric-core", version = "0.3" }
wgpu = "30.0.0"
bytemuck = "1.25.1"
flume = "0.12.0"
pollster = "1.0.1"

[dev-dependencies]
libc = "0.2"
ferric-joule = { path = "../ferric-joule" }
ferric-certify = { path = "../ferric-certify" }
ferric-gguf = { path = "../ferric-gguf" }
pollster = "1.0.1"
half = "2"

# Metal 4 tensor-unit GEMM backend (src/metal4.rs) — macOS only, all vendored.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
objc2-core-ml = { version = "0.3", features = [
    "MLModel", "MLModelConfiguration", "MLMultiArray", "MLFeatureValue", "MLFeatureProvider",
    "MLDictionaryFeatureProvider", "MLComputePlan", "MLComputePlanDeviceUsage",
    "MLComputeDeviceProtocol", "MLNeuralEngineComputeDevice", "MLModelStructure",
    "MLModelStructureProgram", "MLModelStructureProgramFunction", "MLModelStructureProgramBlock",
    "MLModelStructureProgramOperation", "block2",
] }
objc2-foundation = "0.3"
half = "2"
block2 = "0.6"

# NVIDIA native tier: the CUDA driver API over dlopen. Already vendored (via ash); no new source.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
libloading = "0.8"
