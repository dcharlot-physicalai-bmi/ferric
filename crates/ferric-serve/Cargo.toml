[package]
name = "ferric-serve"
description = "OpenAI-compatible HTTP server for Ferric — the adoption on-ramp (drop-in /v1/chat/completions over the pure-Rust cross-fabric runtime)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["llm", "openai", "server", "inference", "ai"]
categories = ["web-programming", "science"]

[lib]
name = "ferric_serve"
path = "src/lib.rs"

[[bin]]
name = "ferric-serve"
path = "src/main.rs"

[dependencies]
ferric-core = { path = "../ferric-core", version = "0.3" }
ferric-tensor = { path = "../ferric-tensor", version = "0.3" }
ferric-gguf = { path = "../ferric-gguf", version = "0.3" }
ferric-llama = { path = "../ferric-llama", version = "0.3" }
ferric-load = { path = "../ferric-load", version = "0.3" }
ferric-joule = { path = "../ferric-joule", version = "0.3" }
ferric-tokenizer = { path = "../ferric-tokenizer", version = "0.3" }
ferric-agent = { path = "../ferric-agent", version = "0.3" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pollster = "0.4"
# The model's own chat template (Jinja), rendered as Hugging Face's apply_chat_template renders it. Vendored
# like every other dependency. `pycompat` adds the Python str/dict methods HF templates call (.strip(),
# .startswith(), .items()); `loop_controls` is jinja2.ext.loopcontrols, which HF enables.
minijinja = { version = "2.24", default-features = false, features = ["builtins", "loop_controls", "macros", "serde", "preserve_order", "adjacent_loop_items", "std_collections", "deserialization", "json"] }
minijinja-contrib = { version = "2.24", default-features = false, features = ["pycompat"] }
# Images a client sends (PNG, JPEG): decoded here, the one crate that receives them, so ferric-tensor stays
# codec-free (see its image.rs). Pure Rust, vendored; checked against the pixels transformers' load_image gives.
# JPEG is src/images/jpeg.rs (libjpeg-turbo's decode path, translated): a general decoder is not enough.
png = "0.18"

[dev-dependencies]
# Reads the gzipped reference pixels in tests/fixtures/images (already vendored as a dependency of png).
flate2 = "1"
# Only for the ignored timing test `jpeg_decode_time` (the decoder this replaced; vendored).
zune-jpeg = "0.5"
zune-core = "0.5"
