[package]
name = "ferric-ffi"
description = "Ferric's stable C ABI (libferric) — the universal on-ramp. Any language with C FFI (Zig, Mojo, Go, Java, C#, Ruby, C/C++) drives the pure-Rust cross-fabric runtime through this."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "ferric"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ferric-serve = { path = "../ferric-serve", version = "0.3" }
serde_json = { version = "1", features = ["preserve_order"] }
