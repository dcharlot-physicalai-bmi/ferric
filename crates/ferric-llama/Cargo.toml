[package]
name = "ferric-llama"
description = "Ferric Llama bridge — load a Llama/SmolLM-family safetensors checkpoint (HF layout, GQA, RoPE, SwiGLU, tied embeddings) and run its forward pass on Ferric's cross-fabric kernels. Pure Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["llama", "llm", "transformer", "ai", "inference"]
categories = ["science"]
exclude = ["testdata/"]

[dependencies]
ferric-joule = { path = "../ferric-joule", version = "0.3" }
ferric-core = { path = "../ferric-core", version = "0.3" }
ferric-load = { path = "../ferric-load", version = "0.3" }
ferric-tensor = { path = "../ferric-tensor", version = "0.3" }
ferric-tier = { path = "../ferric-tier", version = "0.3" }
ferric-kv = { path = "../ferric-kv", version = "0.3" }
ferric-gguf = { path = "../ferric-gguf", version = "0.3" }
pollster = "1.0.1" # MoE routing reads router logits back mid-forward (eager tensors → cheap)
# Promoted from dev-dependencies for bert::Reranker, which owns its tokenizer ON PURPOSE: the
# family is declared by tokenizer.ggml.model and is NOT implied by general.architecture — bge-small
# is "bert"/WordPiece and bge-reranker-v2-m3 is the same arch but "t5"/SentencePiece. Making every
# caller re-derive that is how a four-token "Paris" got compared against a three-token reference.
ferric-tokenizer = { path = "../ferric-tokenizer", version = "0.3" }

[dev-dependencies]
ferric-certify = { path = "../ferric-certify" }
pollster = "1.0.1"
serde_json = "1"
half = "2"
ferric-tensor = { path = "../ferric-tensor" }
ferric-tokenizer = { path = "../ferric-tokenizer" }
ferric-load = { path = "../ferric-load", version = "0.3" }
