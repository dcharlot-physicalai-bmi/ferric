[package]
name = "ferric-load"
description = "Ferric safetensors — pure-Rust reader for the format open weights are PUBLISHED in: lazy multi-shard loading via model.safetensors.index.json, FP8 (E4M3/E5M2) with companion scale tensors, and every integer dtype. No Python, no C++."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["safetensors", "fp8", "weights", "llm", "ml"]
categories = ["science"]
exclude = ["testdata/"]

[dependencies]
serde_json = "1"
half = "2"

[dev-dependencies]
ferric-core = { path = "../ferric-core", version = "0.3" }
pollster = "1.0.1"
